<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Coming Soon — STEAM Teams CC Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- NOTE: Tailwind CDN is intentional. Static HTML/Vercel deployment. Upgrade to CLI before v2. -->
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600;700&family=Archivo+Narrow:ital,wght@0,400;0,500;0,700;1,700&family=Roboto+Flex:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<!-- Public Shell — Design Spec v4 §10.2.1. One shared stylesheet, no per-page shell CSS. -->
<link href="/assets/css/shell.css" rel="stylesheet">
<style>
  .diagonal-stripe {
    background-image: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.05),
      rgba(255,255,255,0.05) 10px,
      transparent 10px,
      transparent 20px
    );
  }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "race-red":"#B2292E","deep-navy":"#1C355E","track-white":"#F8F8F6",
          "asphalt-black":"#1A1A1A","primary":"#011f48","on-primary":"#ffffff"
        },
        fontFamily: {
          "headline-lg":["Domine"],"display-lg":["Domine"],
          "label-caps":["Archivo Narrow"],"body-lg":["Roboto Flex"]
        },
        fontSize: {
          "display-lg":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"700"}],
          "body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],
          "label-caps":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"700"}]
        },
        spacing: { "margin-desktop":"48px","margin-mobile":"16px" }
      }
    }
  }
</script>
</head>
<body class="bg-primary text-on-primary min-h-screen flex flex-col overflow-x-hidden diagonal-stripe">

<!-- ═══════════════════════════════════════════════
     PUBLIC SHELL — header, mobile drawer, login modal.
     Rendered by /assets/js/shell.js. Design Spec v4 §10.
     Do not hand-write a <header> here. Do not fork shell.js/shell.css.
═══════════════════════════════════════════════ -->
<div id="shell-root"></div>

<!-- ── MAIN — §10.7.1 route-aware placeholder content ──────────── -->
<main class="flex-1 flex items-center justify-center px-margin-mobile md:px-margin-desktop py-20">
  <div class="w-full max-w-lg text-center space-y-8">

    <div class="flex justify-center">
      <div class="w-16 h-1 bg-race-red"></div>
    </div>

    <h1 id="cs-heading" class="font-display-lg text-display-lg leading-tight">Not open yet</h1>

    <div class="space-y-3 max-w-sm mx-auto">
      <p id="cs-line1" class="font-body-lg text-body-lg text-on-primary/70">This part of the portal is still being built.</p>
      <p id="cs-line2" class="font-body-lg text-body-lg text-on-primary/70">It isn't open yet.</p>
      <p id="cs-line3" class="font-body-lg text-body-lg text-on-primary/60">For anything you need right now, message us on Remind, email <a href="mailto:stehos@chambersk12.org" class="text-on-primary underline">stehos@chambersk12.org</a>, or call <a href="tel:+13347488665" class="text-on-primary underline">(334) 748-8665</a>.</p>
    </div>

    <!-- §10.7.1: rendered only when cta is non-null and cta.url is non-empty. Hidden by default. -->
    <div id="cs-cta-wrap" class="hidden pt-2">
      <a id="cs-cta" href="#"
        class="bg-race-red text-white px-8 py-4 font-label-caps text-label-caps uppercase tracking-widest inline-block text-center hover:brightness-110 transition-all">
        <span id="cs-cta-label"></span>
      </a>
    </div>

  </div>
</main>

<!-- ═══════════════════════════════════════════════
     PUBLIC SHELL FOOTER — rendered by shell.js, §10.2.8.
═══════════════════════════════════════════════ -->
<div id="shell-footer"></div>

<!-- Public Shell — one shared script, every surface. Design Spec v4 §10.2.1. -->
<script src="/assets/js/shell.js" defer></script>

<script>
// ── §10.7.1 Route-aware content, config-driven with a compiled fallback ──
// The portal's most-visited page must not depend on a network call succeeding,
// so every route below renders correct copy immediately from this fallback,
// then config (portal_config.coming_soon_routes) overwrites it if it arrives
// and differs. No date, month, season, or timeframe anywhere — §10.7.2.
var FALLBACK = {
  "/register": {
    heading: "Register",
    line1: "Registration for the 2026-2027 season is open.",
    line2: "Registration is by invitation link — we send the form by email and hand out a QR code at events.",
    line3: "Need the link? Message us on Remind or email <a href=\"mailto:stehos@chambersk12.org\" class=\"text-on-primary underline\">stehos@chambersk12.org</a>.",
    cta: null
  },
  "/merch": {
    heading: "Merch Store",
    line1: "Official STEAM Teams gear — tees, hats, and race day accessories.",
    line2: "The store isn't open yet.",
    line3: "For anything you need right now, message us on Remind or email <a href=\"mailto:stehos@chambersk12.org\" class=\"text-on-primary underline\">stehos@chambersk12.org</a>.",
    cta: null
  },
  "/sponsors": {
    heading: "Sponsor Us",
    line1: "Partner with STEAM Teams CC and connect your organization to 70+ students and their families.",
    line2: "This page isn't open yet — sponsorship inquiries go through the form on the home page for now.",
    line3: "Ready to talk? Email <a href=\"mailto:stehos@chambersk12.org\" class=\"text-on-primary underline\">stehos@chambersk12.org</a> or call <a href=\"tel:+13347488665\" class=\"text-on-primary underline\">(334) 748-8665</a>.",
    cta: null
  },
  "/student": {
    heading: "Student Portal",
    line1: "Student logins for schedules, tasks, and car assignments.",
    line2: "Student accounts haven't been issued yet.",
    line3: "Ask your coach if you have questions about your team assignment.",
    cta: null
  }
};
var GENERIC = {
  heading: "Not open yet",
  line1: "This part of the portal is still being built.",
  line2: "It isn't open yet.",
  line3: "For anything you need right now, message us on Remind, email <a href=\"mailto:stehos@chambersk12.org\" class=\"text-on-primary underline\">stehos@chambersk12.org</a>, or call <a href=\"tel:+13347488665\" class=\"text-on-primary underline\">(334) 748-8665</a>."
};

function currentPathname() {
  var p = window.location.pathname;
  if (p.length > 1 && p.endsWith("/")) p = p.slice(0, -1);
  return p || "/";
}

function renderContent(entry) {
  if (!entry) return;
  var h = document.getElementById("cs-heading"); if (h && entry.heading) h.textContent = entry.heading;
  var l1 = document.getElementById("cs-line1"); if (l1 && entry.line1) l1.textContent = entry.line1;
  var l2 = document.getElementById("cs-line2"); if (l2 && entry.line2) l2.textContent = entry.line2;
  var l3 = document.getElementById("cs-line3"); if (l3 && entry.line3) l3.innerHTML = entry.line3;
  var ctaWrap = document.getElementById("cs-cta-wrap");
  var cta = entry.cta;
  if (cta && cta.url) {
    document.getElementById("cs-cta-label").textContent = cta.label || "Learn more";
    var a = document.getElementById("cs-cta");
    a.setAttribute("href", cta.url);
    var offsite = /^https?:\/\//i.test(cta.url) && cta.url.indexOf(window.location.host) === -1;
    if (offsite) { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
    else { a.removeAttribute("target"); a.removeAttribute("rel"); }
    ctaWrap.classList.remove("hidden");
  } else {
    ctaWrap.classList.add("hidden");
  }
}

var path = currentPathname();
// Immediate render from the compiled fallback — never depends on the network.
renderContent(path === "/coming-soon.html" ? GENERIC : (FALLBACK[path] || GENERIC));

// ── Config overwrite (§10.7.1) ────────────────────────────────────
var SB_URL = "https://avbogkupsoeraivbyypu.supabase.co";
var SB_KEY = "sb_publishable_jhWuvHQjixbfRPNb9Eyhgg_ogpKCm9f";

fetch(SB_URL + "/rest/v1/portal_config?key=eq.coming_soon_routes&select=value", {
  headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }
}).then(function (r) { return r.json(); }).then(function (rows) {
  if (!rows || !rows.length) return; // Config missing — fallback already rendered.
  var routes = rows[0].value;
  if (typeof routes === "string") { try { routes = JSON.parse(routes); } catch (e) { return; } }
  if (routes && routes[path]) renderContent(routes[path]);
}).catch(function (e) {
  // Fetch failed — fallback already rendered, nothing further to do.
  console.warn("coming-soon: could not reach portal_config", e);
});
</script>

</body>
</html>
